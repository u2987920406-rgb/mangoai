name: Mango standalone
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: mangoai
      - uses: actions/checkout@v4
        with:
          repository: u2987920406-rgb/MangoQA
          ref: e67700f4e132a6ce6c2a0d03db4127b43fa853b2
          path: MangoQA
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run setup
        working-directory: mangoai
      - run: npx playwright install --with-deps chromium
        working-directory: mangoai/server
      - run: npm run typecheck && npm --prefix ui test && npm run test:standalone && npm run test:browser
        working-directory: mangoai
      - run: npm run test:offline
        working-directory: mangoai/server
      - run: node --import tsx src/tests/test-preview-live.ts
        working-directory: mangoai/server
      - run: npm test && npm run typecheck
        working-directory: MangoQA
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: mangoai/test-results
          if-no-files-found: ignore
